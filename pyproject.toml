[project]
name = "ecommerce-analytics-chatbot"
version = "0.1.0"
description = "E-Commerce Sales Analytics Chatbot using MCP"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "fastmcp<4",
    "google-genai",
    "groq",
    "python-dotenv",
    "streamlit",
    "plotly",
    "requests",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*"]